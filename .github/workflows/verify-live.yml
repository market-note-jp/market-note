name: Verify Live Market Note

on:
  workflow_run:
    workflows: ["Publish Market Note"]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  verify-live:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out deployed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Find latest daily report date
        id: latest
        shell: bash
        run: |
          latest_file="$(find content/daily -maxdepth 1 -type f -name 'daily-*.json' -printf '%f\n' | sort | tail -n 1)"
          test -n "$latest_file"
          date="${latest_file#daily-}"
          date="${date%.json}"
          echo "date=$date" >> "$GITHUB_OUTPUT"

      - name: Verify exact deployed main SHA and live content
        run: npm run verify:publication -- "${{ steps.latest.outputs.date }}" "${{ github.event.workflow_run.head_sha }}"
