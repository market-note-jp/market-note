name: Verify Live Market Note

on:
  workflow_run:
    workflows: ["Publish Market Note"]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  verify-live:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out deployed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Find latest daily report month
        id: latest
        shell: bash
        run: |
          latest_file="$(find content/daily -maxdepth 1 -type f -name 'daily-*.json' -printf '%f\n' | sort | tail -n 1)"
          test -n "$latest_file"
          date="${latest_file#daily-}"
          date="${date%.json}"
          month="${date:0:7}"
          echo "date=$date" >> "$GITHUB_OUTPUT"
          echo "month=$month" >> "$GITHUB_OUTPUT"

      - name: Verify latest report and every content-driven report in the current month
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="${{ github.event.workflow_run.head_sha }}"
          month="${{ steps.latest.outputs.month }}"
          files=(content/daily/daily-"$month"-*.json)
          test -e "${files[0]}"
          latest="${{ steps.latest.outputs.date }}"
          for file in "${files[@]}"; do
            name="$(basename "$file" .json)"
            date="${name#daily-}"
            echo "Verifying $date against $sha"
            if [ "$date" = "$latest" ]; then
              npm run verify:publication -- "$date" "$sha"
            else
              npm run verify:publication -- "$date" "$sha" --article-only
            fi
          done
