name: Verify Market Note favicon once

on:
  push:
    branches: [verify-favicon-20261031-a122765]

permissions: {}

jobs:
  verify-favicon:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify live icon links and approved SVG bytes
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import time
          import urllib.request
          from datetime import datetime, timezone
          from html.parser import HTMLParser
          from urllib.parse import urljoin

          HOME = 'https://market-note-jp.github.io/market-note/'
          ICON = HOME + 'favicon.svg?v=market-note-m-20261031'
          EXPECTED_SHA256 = '87daf779cbc43d847c6e75b3f0a35d3fe5a98697b958237c58294066b74b80a5'

          class Icons(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.links = []
              def handle_starttag(self, tag, attrs):
                  values = dict(attrs)
                  rel = values.get('rel', '').lower()
                  if tag == 'link' and 'icon' in rel.split():
                      self.links.append({'rel': rel, 'href': urljoin(HOME, values.get('href', ''))})

          def get(url):
              request = urllib.request.Request(url, headers={
                  'User-Agent': 'Market-Note-favicon-verification',
                  'Cache-Control': 'no-cache',
              })
              with urllib.request.urlopen(request, timeout=15) as response:
                  assert response.status == 200, (url, response.status)
                  return response.read(), response.headers.get('Content-Type', '')

          for attempt in range(1, 25):
              try:
                  html, _ = get(HOME)
                  parser = Icons()
                  parser.feed(html.decode('utf-8'))
                  assert {'icon', 'shortcut icon'} <= {link['rel'] for link in parser.links}, parser.links
                  assert all(link['href'] == ICON for link in parser.links), parser.links
                  svg, content_type = get(ICON)
                  assert 'image/svg+xml' in content_type.lower(), content_type
                  digest = hashlib.sha256(svg).hexdigest()
                  assert digest == EXPECTED_SHA256, digest
                  plain_svg, _ = get(HOME + 'favicon.svg')
                  assert hashlib.sha256(plain_svg).hexdigest() == EXPECTED_SHA256
                  print(json.dumps({
                      'status': 'verified',
                      'checked_at': datetime.now(timezone.utc).isoformat(),
                      'expected_site_commit': 'a1227650fc5894e5caede5e48e0526a5dfd92251',
                      'homepage_http': 200,
                      'homepage': HOME,
                      'icon_links': parser.links,
                      'icon_http': 200,
                      'content_type': content_type,
                      'svg_sha256': digest,
                      'unversioned_icon_matches': True,
                  }, ensure_ascii=False, indent=2))
                  break
              except Exception as error:
                  print(f'Attempt {attempt}/24: {type(error).__name__}: {error}', flush=True)
                  if attempt == 24:
                      raise
                  time.sleep(15)
          PY
